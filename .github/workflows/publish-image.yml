# Builds the codespace image once and publishes it to GitHub Container
# Registry, so a new codespace pulls a finished image instead of compiling the
# R and Bioconductor packages itself.
#
# Why an image and not a Codespaces prebuild: a prebuild belongs to this repo
# only. Repos made with "Use this template" do not inherit it. They do inherit
# devcontainer.json, which points at this image.
#
# The image holds only what the Dockerfile builds (R, tidyverse, Bioconductor,
# microViz). The Quarto and Node features and setup.sh still run when each
# codespace is created; they take a minute or two.
#
# After the first run, make the package public once:
# github.com/elsherbini?tab=packages → this package → Package settings →
# Change visibility → Public. Participants' copies cannot pull a private image.
name: Publish codespace image

on:
  workflow_dispatch:
  push:
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/install-r-packages.R
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/elsherbini/data-science-for-biology-nov2026-codespace

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The image is several GB and the runner starts with ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:nov2026
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Links the package to this repo on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Codespace image for the Nov 2026 Data Science for Biology workshop
